name: Local Windows and Linux
on:
  push:
    branches: [main, Teo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      DAYBREAK_OPERATIONS_TEST_DATA: data/local-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: uv sync --locked
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - run: uv run pytest tests/operations tests/runtime tests/channels/test_provider.py tests/test_local_platform.py
      - run: uv run python scripts/daybreak_runtime.py prepare
      - run: uv run python scripts/daybreak_runtime.py check
