<!doctype html>
<html lang="ro" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 300 800;
        font-display: block;
        src: url("assets/fonts/HankenGrotesk-normal-300_800-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329,
          U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        font-style: normal;
        font-weight: 300 800;
        font-display: block;
        src: url("assets/fonts/HankenGrotesk-normal-300_800-latin.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --ground: #07090d;
        --ink: #f2efe8;
        --accent: #ffa53d;
        --font-display: "Hanken Grotesk", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #test-card {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #test-title {
        font-size: 120px;
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      #test-title span {
        display: inline-block;
      }
      #test-title .acc {
        color: var(--accent);
      }
      #test-sub {
        font-size: 34px;
        font-weight: 450;
        letter-spacing: -0.01em;
        color: rgba(242, 239, 232, 0.72);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2"
      data-width="1920"
      data-height="1080"
    >
      <div id="test-card" class="clip" data-start="0" data-duration="2" data-track-index="0">
        <h1 id="test-title"><span id="w1">Tura</span> <span id="w2">de</span> <span id="w3" class="acc">mâine</span></h1>
        <p id="test-sub">Test HyperFrames · diacritice: ș ț ă â î · 2 secunde</p>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Fiecare cuvânt intră cu blur, fără translație (regula din motion.md), 0,067 s între cuvinte.
      ["#w1", "#w2", "#w3"].forEach((sel, i) => {
        tl.fromTo(
          sel,
          { opacity: 0, filter: "blur(10px)" },
          { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
          0.25 + i * 0.12,
        );
      });
      tl.fromTo("#test-sub", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
