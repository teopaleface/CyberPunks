      @font-face {
        font-family: "Archivo";

        font-stretch: 62% 125%;
        font-display: block;
        src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Archivo";
        font-style: normal;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
        src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin.woff2") format("woff2");

      /* Filmul nou (după referința lui Teo): fond alb pur, text uriaș în cerneala produsului,
         final pe cerneală. Culorile surselor sunt cele din consola "Panou" (temă deschisă). */
      :root {
        --ground: var(--color-ground, #ffffff);
        --ink: var(--color-ink, #0b1622);
        --ui-ink: #13202a;
        --muted: #56616b;
        --paper: #f5f4f0;
        --paper-2: rgba(245, 244, 240, 0.66);
        --paper-3: rgba(245, 244, 240, 0.44);
        --sun: var(--color-sun, #f2a20c);
        --canvas: #e4e7e6;
        --panel: #f2f3f1;
        --src-a: #2364d2;
        --src-b: #a23c9e;
        --src-c: #d99100;
        --att: #d4430f;
        --font-display: "Archivo", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      #bg-ground {
        position: absolute;
        inset: 0;
        background: var(--ground);
      }
    </style>
  </head>
