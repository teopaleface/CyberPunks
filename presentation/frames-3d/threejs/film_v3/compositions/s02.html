<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s2-stage { position: absolute; inset: 0; }
    #s2-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  </style>
  <!-- 2 · Poles fall. Houses go dark. (rack-focus in; stepped exposure dips on the words; rings collapse on 3 houses) -->
  <div id="root" data-composition-id="s02" data-width="1920" data-height="1080">
    <div id="s2-stage"></div>
    <svg id="s2-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
  </div>
  <script>
    (function () {
      const S = DB.scene("s02"), tl = gsap.timeline({ paused: true });
      const root = document.querySelector("#s2-stage"), svg = document.querySelector("#s2-svg"), L = V3L;
      const planet = DB.plate(root, "p02_dark", "cut");
      const pc = L.planet.p02_dark.c;
      const words = [DB.wordT(2, /^Houses/), DB.wordT(2, /^go$/), DB.wordT(2, /^dark/)];
      const rings = words.map((w, i) => DB.el("circle", { r: 44, fill: "none", stroke: DB.css("--db-ink"), "stroke-width": 3, opacity: 0, id: "s2-r" + i }, svg));
      const k1 = DB.keyLines(root, "s2-a", ["Poles fall."], { size: 108, top: 270 });
      const k2 = DB.keyLines(root, "s2-b", ["Houses", "go dark."], { size: 108, top: 270 + 108 * 0.92 });
      const cam = (t) => {
        const u = DB.seg(t, -4.48, S.end); // continues the storm push
        const focus = DB.E.o2(DB.seg(t, S.start, S.start + 0.42)); // rack focus in
        return { s: (1 + 0.07 * DB.E.sine(u)) * (1.04 - 0.04 * focus), r: 1.2 + 0.8 * u, x: L.offset.p02_dark, ox: pc[0], oy: pc[1], blur: 8 * (1 - focus) };
      };
      DB.drive(tl, S.start, S.dur, (t) => {
        const c = cam(t);
        // stepped exposure: each word darkens the village one notch (quick dip, then settle)
        let ex = 1;
        words.forEach((w, i) => { const k = DB.seg(t, w, w + 0.14); if (t >= w) ex = 1 - 0.13 * (i + 1) - 0.12 * (1 - k); });
        planet.update(c);
        planet.el.style.filter = (c.blur > 0.3 ? `blur(${c.blur.toFixed(1)}px) ` : "") + `brightness(${ex.toFixed(3)})`;
        L.dark.forEach((h, i) => { const [x, y] = planet.map(h[0], h[1], c); rings[i].setAttribute("cx", x.toFixed(1)); rings[i].setAttribute("cy", y.toFixed(1)); });
      });
      // a ring collapses onto a house on each word (same frame as its exposure step)
      words.forEach((w, i) => {
        const tw = w - S.start;
        tl.set("#s2-r" + i, { opacity: 0.95 }, tw);
        tl.fromTo("#s2-r" + i, { attr: { r: 44 } }, { attr: { r: 0 }, duration: 0.25, ease: "power3.in", immediateRender: false }, tw);
        tl.set("#s2-r" + i, { opacity: 0 }, tw + 0.25);
      });
      DB.arrive(tl, k1, DB.line(2).start - S.start);
      DB.arrive(tl, k2, words[0] - S.start);
      DB.leaveUp(tl, [...k1, ...k2], S.dur);
      window.__timelines["s02"] = tl;
    })();
  </script>
</template>
