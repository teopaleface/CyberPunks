<template>
  <style>
    #root { position: absolute; inset: 0; }
    #rt-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .rt-h { position: absolute; left: 120px; font-size: 150px; }
    .rt-pill { position: absolute; left: 0; top: 0; padding-left: 68px; }
  </style>
  <!-- Style frame 04: "Every crew knows where to go." + solid crew pills tied to the trucks
       (leader + small ping); the 3D truck sprites land in the pills' icon slots (objects layer). -->
  <div id="root" data-composition-id="routes" data-width="1920" data-height="1080">
    <svg id="rt-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow><g id="rt-rings"></g><g id="rt-lines"></g><g id="rt-pings"></g><circle id="rt-house" r="18" fill="none" stroke-width="3" opacity="0" /></svg>
    <div class="rt-h display" id="rt-l1" style="top:110px">Every crew</div>
    <div class="rt-h display" id="rt-l2" style="top:245px">knows where</div>
    <div class="rt-h display" id="rt-l3" style="top:380px">to go.</div>
    <div class="rt-pill db-pill" id="rt-p1" style="background:var(--db-orange)">Crew 1 · 4 stops</div>
    <div class="rt-pill db-pill" id="rt-p2" style="background:var(--db-cyan)">Crew 2 · 3 stops</div>
    <div class="rt-pill db-pill" id="rt-p3" style="background:var(--db-blue)">Crew 3 · 3 stops</div>
  </div>
  <script>
    (function () {
      const S0 = 11.099, D = 5.457;
      const tl = gsap.timeline({ paused: true });
      const col = { orange: DB.css("--db-orange"), cyan: DB.css("--db-cyan"), blue: DB.css("--db-blue") };
      const cc = [col.orange, col.cyan, col.blue];
      const linesG = document.getElementById("rt-lines"), pingsG = document.getElementById("rt-pings"), ringsG = document.getElementById("rt-rings");
      const beats = [12.655, 13.444, 14.21];
      const chips = [1, 2, 3].map((n) => {
        const L = DB.leader(linesG, cc[n - 1]); L.el.id = "rt-ld" + n;
        const P = DB.ping(pingsG, cc[n - 1], false); P.g.id = "rt-pg" + n; P.g.setAttribute("opacity", 0);
        return { n, L, P, pill: document.getElementById("rt-p" + n), born: beats[n - 1] };
      });
      // pin landing rings (one per pin, on its beat)
      const pinBeats = [12.655, 13.444, 14.21, 15.0];
      const pcol = { orange: col.orange, cyan: col.cyan, blue: col.blue };
      const rings = DB.T.names.filter((n) => n.startsWith("pin_")).map((n) => {
        const [, key, k] = n.split("_");
        const c = DB.el("circle", { r: 10, fill: "none", stroke: pcol[key], "stroke-width": 3, opacity: 0 }, ringsG);
        return { c, name: n, beat: pinBeats[+k] };
      });
      const house = document.getElementById("rt-house");
      house.setAttribute("stroke", col.cyan);
      DB.drive(tl, S0, D, (t) => {
        for (const ch of chips) {
          const c = DBL.chip(ch.n, t);
          gsap.set(ch.pill, { x: c.x, y: c.y });
          const attach = DBL.CHIP[ch.n][0] < 0 ? [c.x + ch.pill.offsetWidth, c.y + 28] : [c.x, c.y + 28];
          ch.L.update([[c.ax, c.ay], attach]);
          ch.P.update(c.ax, c.ay);
          // a pill leaves when its truck goes over the planet's limb
          const live = t >= ch.born && c.v;
          ch.P.g.setAttribute("opacity", live ? 1 : 0);
          ch.L.el.setAttribute("opacity", live ? 1 : 0);
          ch.pill.style.visibility = live ? "visible" : "hidden";
        }
        for (const r of rings) { const p = DB.at(r.name, t); r.c.setAttribute("cx", p.x.toFixed(1)); r.c.setAttribute("cy", p.y.toFixed(1)); }
        const h = DB.at("unsure_house", t);
        house.setAttribute("cx", h.x.toFixed(1)); house.setAttribute("cy", h.y.toFixed(1));
      });
      // headline: waterfall entry from below on 12.655 (binary opacity, power4.out)
      gsap.set(["#rt-l1", "#rt-l2", "#rt-l3"], { opacity: 0 });
      [["#rt-l1", 0, 70, 0.2], ["#rt-l2", 0.05, 50, 0.17], ["#rt-l3", 0.092, 46, 0.15]].forEach(([s, dt, y, d]) => {
        tl.set(s, { opacity: 1 }, 12.655 - S0 + dt);
        tl.fromTo(s, { y }, { y: 0, duration: d, ease: "power4.out", immediateRender: false }, 12.655 - S0 + dt);
      });
      // pills arrive from below on their beats, the leader draws from the truck
      chips.forEach((ch) => {
        const b = ch.born - S0;
        tl.fromTo(ch.pill, { yPercent: 60 }, { yPercent: 0, duration: 0.2, ease: "power4.out" }, b);
        tl.fromTo(`#rt-ld${ch.n}`, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.25, ease: "power3.out" }, b);
      });
      // pin rings: expand and fade once on each pin's beat
      for (const r of rings) {
        tl.set(r.c, { opacity: 0.95 }, r.beat - S0);
        tl.fromTo(r.c, { attr: { r: 8 } }, { attr: { r: 48 }, opacity: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, r.beat - S0);
      }
      // the unsure house gets its cyan ring just before the rack focus (the carrier of seam 5)
      tl.set("#rt-house", { opacity: 1 }, 16.2 - S0);
      tl.fromTo("#rt-house", { attr: { r: 40 } }, { attr: { r: 18 }, duration: 0.3, ease: "power3.out", immediateRender: false }, 16.2 - S0);
      window.__timelines["routes"] = tl;
    })();
  </script>
</template>
