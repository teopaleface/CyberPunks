<template>
  <style>
    @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    #root { position: absolute; inset: 0; font-family: "Archivo", sans-serif; color: #f5f7fa; }
    #rt-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #rt-head { position: absolute; left: 192px; top: 168px; font-size: 92px; line-height: 1.02; font-weight: 730; font-stretch: 108%; letter-spacing: -0.03em; }
    #rt-head .ln { display: block; overflow: hidden; padding-bottom: 0.1em; margin-bottom: -0.1em; }
    #rt-head .li { display: inline-block; white-space: nowrap; }
    .rt-chip { position: absolute; left: 0; top: 0; }
    .rt-pill { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px 0 16px; white-space: nowrap;
      background: rgba(0, 15, 30, 0.9); border: 1px solid rgba(245, 247, 250, 0.16); border-radius: 26px; font-size: 26px; font-weight: 600; letter-spacing: -0.005em; }
    .rt-dot { width: 12px; height: 12px; border-radius: 50%; }
    .rt-sep { color: rgba(245, 247, 250, 0.45); }
  </style>
  <div id="root" data-composition-id="routes" data-width="1920" data-height="1080">
    <svg id="rt-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow><g id="rt-rings"></g></svg>
    <div id="rt-head"><span class="ln"><span class="li" id="rt-l1">Every crew knows</span></span><span class="ln"><span class="li" id="rt-l2">where to go.</span></span></div>
    <div class="rt-chip" id="rt-ch1"><div class="rt-pill" id="rt-p1"><span class="rt-dot" style="background:#fa4616"></span>Crew 1 <span class="rt-sep">·</span> 4 stops</div></div>
    <div class="rt-chip" id="rt-ch2"><div class="rt-pill" id="rt-p2"><span class="rt-dot" style="background:#00a3e0"></span>Crew 2 <span class="rt-sep">·</span> 3 stops</div></div>
    <div class="rt-chip" id="rt-ch3"><div class="rt-pill" id="rt-p3"><span class="rt-dot" style="background:#163fe8"></span>Crew 3 <span class="rt-sep">·</span> 3 stops</div></div>
  </div>
  <script>
    (function () {
      const S0 = 11.099, D = 5.457;
      const NS = "http://www.w3.org/2000/svg";
      const tl = gsap.timeline({ paused: true });
      // ribbon colour per crew: truck_1 = orange, truck_2 = cyan, truck_3 = blue
      const chips = [1, 2, 3].map((n) => ({ el: document.getElementById("rt-ch" + n), pill: document.getElementById("rt-p" + n), a: "truck_" + n, vis: { v: 0 } }));
      // pin landing rings (one per pin, on its beat)
      const ringsG = document.getElementById("rt-rings");
      const pinBeats = [12.655, 13.444, 14.21, 15.0];
      const col = { orange: "#fa4616", cyan: "#00a3e0", blue: "#163fe8" };
      const rings = DB.T.names.filter((n) => n.startsWith("pin_")).map((n) => {
        const [, key, k] = n.split("_");
        const c = document.createElementNS(NS, "circle");
        c.setAttribute("r", "10"); c.setAttribute("fill", "none"); c.setAttribute("stroke", col[key]); c.setAttribute("stroke-width", "3");
        ringsG.appendChild(c);
        return { c, name: n, beat: pinBeats[+k] };
      });
      DB.drive(tl, S0, D, (t) => {
        // place chips above their trucks; a chip that would overlap an earlier one moves up a row
        const placed = [];
        for (const ch of chips) {
          const p = DB.at(ch.a, t);
          let y = p.y - 30;
          for (let k = 0; k < 3; k++) {
            const hit = placed.some((q) => Math.abs(q.x - p.x) < 250 && Math.abs(q.y - y) < 60);
            if (!hit) break;
            y -= 62;
          }
          if (p.v) placed.push({ x: p.x, y });
          gsap.set(ch.el, { x: p.x, y });
          gsap.set(ch.pill, { xPercent: -50, yPercent: -100, autoAlpha: p.v ? 1 : 0.0 });
        }
        for (const r of rings) {
          const p = DB.at(r.name, t);
          r.c.setAttribute("cx", p.x.toFixed(1)); r.c.setAttribute("cy", p.y.toFixed(1));
        }
      });
      // headline: two masked lines on 11.099 and 11.865
      const lis = document.querySelectorAll("#rt-head .li");
      tl.fromTo("#rt-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, 0);
      tl.fromTo("#rt-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, 0.766);
      // chips pop when the crews roll out (12.655 = first pin beat)
      chips.forEach((ch, i) => {
        tl.fromTo(ch.pill.children, { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 1.556 + i * 0.08);
        tl.fromTo(ch.pill, { scale: 0.6 }, { scale: 1, duration: 0.34, ease: "back.out(1.6)" }, 1.556 + i * 0.08);
      });
      // rings: expand and fade on each pin's beat
      for (const r of rings) {
        tl.fromTo(r.c, { attr: { r: 6 }, opacity: 0 }, { attr: { r: 6 }, opacity: 0.95, duration: 0.01 }, r.beat - S0 + 0.12);
        tl.to(r.c, { attr: { r: 46 }, opacity: 0, duration: 0.6, ease: "power2.out" }, r.beat - S0 + 0.13);
      }
      // exit: headline lifts away, chips shrink into their trucks
      tl.to(lis, { yPercent: -110, duration: 0.32, ease: "power3.in", stagger: 0.05 }, D - 0.4);
      tl.to(chips.map((c) => c.pill), { scale: 0, duration: 0.24, ease: "power3.in" }, D - 0.3);
      window.__timelines["routes"] = tl;
    })();
  </script>
</template>
