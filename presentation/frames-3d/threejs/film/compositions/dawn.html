<template>
  <style>
    #root { position: absolute; inset: 0; }
    #dw-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #dw-num { position: absolute; left: 120px; top: 90px; font-size: 330px; letter-spacing: -0.05em; transform-origin: 0% 60%; }
    .dw-sub { position: absolute; left: 132px; font-size: 76px; }
    #dw-note { position: absolute; left: 134px; top: 590px; font-size: 30px; }
    #dw-clock { position: absolute; right: 120px; top: 96px; font-size: 44px; display: flex; align-items: center; gap: 16px; }
    #dw-cdot { width: 22px; height: 22px; border-radius: 50%; display: inline-block; background: var(--db-ink); }
    #dw-time { position: relative; display: inline-block; width: 3.1em; height: 1.1em; overflow: hidden; }
    #dw-time span { position: absolute; left: 0; top: 0; }
  </style>
  <!-- Style frame 06: a giant solid PPC-orange sun rising behind the planet's horizon. -->
  <div id="root" data-composition-id="dawn" data-width="1920" data-height="1080">
    <svg id="dw-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <defs><mask id="dw-mask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
        <rect x="0" y="0" width="1920" height="1080" fill="#fff" /><circle id="dw-planet" cx="900" cy="1650" r="1000" fill="#000" />
      </mask></defs>
      <circle id="dw-sun" cx="1480" cy="640" r="420" mask="url(#dw-mask)" />
      <circle id="dw-pc" cx="900" cy="1650" r="1000" fill="none" stroke="#fff" stroke-opacity="0.01" />
    </svg>
    <div id="dw-num" class="display">+49%</div>
    <div class="dw-sub head" id="dw-s1" style="top:400px">Same crews.</div>
    <div class="dw-sub head" id="dw-s2" style="top:472px">More value.</div>
    <div id="dw-note" class="body muted">30-day simulation</div>
    <div id="dw-clock" class="mono"><span id="dw-cdot"></span><span id="dw-time"><span id="dw-t0">02:00</span><span id="dw-t1">02:00</span></span></div>
  </div>
  <script>
    (function () {
      const S0 = 20.457, D = 4.667;
      const tl = gsap.timeline({ paused: true });
      const sun = document.getElementById("dw-sun"); sun.setAttribute("fill", DB.css("--db-sun"));
      const num = document.getElementById("dw-num");
      const t0 = document.getElementById("dw-t0"), t1 = document.getElementById("dw-t1");
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const o2 = (x) => 1 - (1 - x) * (1 - x), expoOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), in3 = (x) => x * x * x;
      DB.drive(tl, S0, D, (t) => {
        const p = DB.planet(t);
        for (const id of ["dw-planet", "dw-pc"]) { const c = document.getElementById(id); c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("r", (p.r * 0.995).toFixed(1)); }
        // the sun rises from behind the horizon (y +300 -> 0, 1.2 s power2.out) and sinks at the pull-back
        const rise = o2(clamp((t - S0) / 1.2));
        const sink = in3(clamp((t - 24.85) / 0.274));
        sun.setAttribute("cy", (640 + 300 * (1 - rise) + 420 * sink).toFixed(1));
        // the time rolls 02:00 -> 06:00 on the beats (odometer), the dot turns into the sun at 06:00
        const steps = [[20.457, "02:00"], [21.223, "04:00"], [22.012, "06:00"]];
        let k = 0; for (let i = 0; i < steps.length; i++) if (t >= steps[i][0]) k = i;
        const r = clamp((t - steps[k][0]) / 0.2);
        t1.textContent = steps[k][1]; t0.textContent = k > 0 ? steps[k - 1][1] : steps[0][1];
        t1.style.transform = `translateY(${((1 - r) * 100).toFixed(1)}%)`; t0.style.transform = `translateY(${(-r * 100).toFixed(1)}%)`;
        t0.style.opacity = k > 0 ? 1 - r : 0;
        document.getElementById("dw-cdot").style.background = t >= 22.012 ? DB.css("--db-orange") : DB.css("--db-ink");
        // +49% counts up from +0% with the inverse zoom (0.5 s expo.out, tabular figures)
        const c = expoOut(clamp((t - 22.012) / 0.5));
        num.textContent = "+" + Math.round(49 * c) + "%";
      });
      gsap.set(["#dw-num", "#dw-s1", "#dw-s2", "#dw-note", "#dw-clock"], { opacity: 0 });
      // clock arrives with the scene
      tl.set("#dw-clock", { opacity: 1 }, 0);
      // 22.012: "+49%" arrives as an inverse zoom-through (1.25 -> 1, blur 10 -> 0, 0.5 s expo.out)
      tl.fromTo("#dw-num", { opacity: 0.15, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 22.012 - S0);
      // "Same crews." on 22.779; "More value." + "30-day simulation" on 24.334 (waterfall entry)
      const arrive = (sel, t, y, d) => { tl.set(sel, { opacity: 1 }, t - S0); tl.fromTo(sel, { y }, { y: 0, duration: d, ease: "power4.out", immediateRender: false }, t - S0); };
      arrive("#dw-s1", 22.779, 60, 0.18);
      arrive("#dw-s2", 24.334, 60, 0.18);
      arrive("#dw-note", 24.334 + 0.05, 34, 0.13);
      // seam 7 (25.124): every word exits upward (waterfall cut), still moving at the cut
      ["#dw-num", "#dw-s1", "#dw-s2", "#dw-note", "#dw-clock"].forEach((s, i, a) => {
        const start = 25.124 - 0.34 - 0.022 * (a.length - 1 - i) - S0;
        tl.to(s, { y: "-=230", duration: 0.34, ease: "power4.in" }, start);
        tl.to(s, { opacity: 0, duration: 0.18, ease: "none" }, start + 0.16);
      });
      window.__timelines["dawn"] = tl;
    })();
  </script>
</template>
