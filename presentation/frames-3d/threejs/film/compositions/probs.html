<template>
  <style>
    @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
    #root { position: absolute; inset: 0; font-family: "Archivo", sans-serif; color: #f5f7fa; }
    #pb-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .pb-box { position: absolute; left: 0; top: 0; }
    .pb-card { position: absolute; top: -29px; display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 24px 0 16px; white-space: nowrap;
      background: rgba(0, 15, 30, 0.9); border: 1px solid rgba(245, 247, 250, 0.16); border-radius: 6px; font-size: 30px; font-weight: 640; font-stretch: 104%; letter-spacing: -0.012em; }
    .pb-card.r { left: 0; transform-origin: 0% 50%; }
    .pb-card.l { right: 0; transform-origin: 100% 50%; }
    .pb-tick { width: 5px; height: 30px; border-radius: 2px; }
    #pb-q { position: absolute; left: 0; width: 1920px; top: 158px; text-align: center; font-size: 100px; line-height: 1.05; font-weight: 740; font-stretch: 108%; letter-spacing: -0.03em; white-space: nowrap; }
    #pb-q .w { display: inline-block; overflow: hidden; padding: 0 0.02em 0.14em; margin-bottom: -0.14em; vertical-align: top; }
    #pb-q .wi { display: inline-block; }
    #pb-qm { display: inline-block; width: 0.52em; height: 0.8em; vertical-align: baseline; }
  </style>
  <div id="root" data-composition-id="probs" data-width="1920" data-height="1080">
    <svg id="pb-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow>
      <g id="pb-m1"><path class="pb-lead" id="pb-lead1" pathLength="1" fill="none" stroke="#fa4616" stroke-width="2.5" stroke-dasharray="1" stroke-dashoffset="1" />
        <circle class="pb-halo" id="pb-h1" r="12" fill="none" stroke="#fa4616" stroke-width="2" /><circle id="pb-c1" r="11" fill="#000f1e" stroke="#fa4616" stroke-width="3" /><circle id="pb-d1" r="4.5" fill="#fa4616" /></g>
      <g id="pb-m2"><path class="pb-lead" id="pb-lead2" pathLength="1" fill="none" stroke="#00a3e0" stroke-width="2.5" stroke-dasharray="1" stroke-dashoffset="1" />
        <circle class="pb-halo" id="pb-h2" r="12" fill="none" stroke="#00a3e0" stroke-width="2" /><circle id="pb-c2" r="11" fill="#000f1e" stroke="#00a3e0" stroke-width="3" /><circle id="pb-d2" r="4.5" fill="#00a3e0" /></g>
      <g id="pb-m3"><path class="pb-lead" id="pb-lead3" pathLength="1" fill="none" stroke="#163fe8" stroke-width="2.5" stroke-dasharray="1" stroke-dashoffset="1" />
        <circle class="pb-halo" id="pb-h3" r="12" fill="none" stroke="#163fe8" stroke-width="2" /><circle id="pb-c3" r="11" fill="#000f1e" stroke="#163fe8" stroke-width="3" /><circle id="pb-d3" r="4.5" fill="#163fe8" /></g>
      <path id="pb-thread" pathLength="1" fill="none" stroke="#fa4616" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 1.2" stroke-dashoffset="1.1" />
      <circle id="pb-dot" r="8.5" fill="#fa4616" />
    </svg>
    <div class="pb-box" id="pb-b1"><div class="pb-card r" id="pb-k1"><span class="pb-tick" style="background:#fa4616"></span>Fallen poles.</div></div>
    <div class="pb-box" id="pb-b2"><div class="pb-card l" id="pb-k2"><span class="pb-tick" style="background:#00a3e0"></span>Stolen power.</div></div>
    <div class="pb-box" id="pb-b3"><div class="pb-card l" id="pb-k3"><span class="pb-tick" style="background:#163fe8"></span>Too much sun.</div></div>
    <div id="pb-q">Where do crews go first<span id="pb-qm"></span></div>
  </div>
  <script>
    (function () {
      const S0 = 6.432;
      const tl = gsap.timeline({ paused: true });
      const svg = document.getElementById("pb-svg");
      const qm = document.getElementById("pb-qm");
      // anchor, label offset (dx, dy), side
      const L = [
        { a: "fallen_pole", dx: 150, dy: -112, n: 1 },
        { a: "meter", dx: -150, dy: -96, n: 2 },
        { a: "hot_roof", dx: -170, dy: 104, n: 3 },
      ];
      const $ = (id) => document.getElementById(id);
      DB.drive(tl, S0, 3.042, (t) => {
        for (const l of L) {
          const p = DB.at(l.a, t);
          const ex = p.x + l.dx, ey = p.y + l.dy;
          const kx = p.x + Math.sign(l.dx) * Math.abs(l.dy) * 0.55;
          $("pb-lead" + l.n).setAttribute("d", `M${p.x.toFixed(1)} ${p.y.toFixed(1)} L${kx.toFixed(1)} ${ey.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}`);
          for (const c of ["pb-c", "pb-d", "pb-h"]) { $(c + l.n).setAttribute("cx", p.x.toFixed(1)); $(c + l.n).setAttribute("cy", p.y.toFixed(1)); }
          gsap.set("#pb-b" + l.n, { x: ex + Math.sign(l.dx) * 6, y: ey });
        }
        // the orange thread: from the fallen pole up into the question mark
        const pr = svg.getBoundingClientRect(), qr = qm.getBoundingClientRect();
        const s = 1920 / (pr.width || 1920);
        const qx = (qr.left - pr.left) * s, qy = (qr.top - pr.top) * s, qh = qr.height * s || 80;
        const u = qh / 100;
        const P = (x, y) => `${(qx + x * u).toFixed(1)} ${(qy + y * u).toFixed(1)}`;
        const a = DB.at("fallen_pole", t);
        const d = `M${a.x.toFixed(1)} ${a.y.toFixed(1)} C${(a.x + 40).toFixed(1)} ${(a.y - 260).toFixed(1)} ${(qx - 260 * u).toFixed(1)} ${(qy + 30 * u).toFixed(1)} ${P(4, 30)} C${P(4, 4)} ${P(50, -4)} ${P(54, 24)} C${P(58, 46)} ${P(30, 50)} ${P(29, 70)} L${P(29, 80)}`;
        $("pb-thread").setAttribute("d", d);
        $("pb-dot").setAttribute("cx", (qx + 29 * u).toFixed(1));
        $("pb-dot").setAttribute("cy", (qy + 101 * u).toFixed(1));
      });
      // pops on 6.432 / 7.221 / 7.987 (local 0 / 0.789 / 1.555)
      [0.0, 0.789, 1.555].forEach((b, i) => {
        const n = i + 1;
        tl.fromTo(`#pb-c${n}, #pb-d${n}`, { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.32, ease: "back.out(1.7)", transformBox: "fill-box" }, b);
        tl.fromTo(`#pb-h${n}`, { scale: 1, opacity: 0.9, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 3.2, opacity: 0, duration: 0.6, ease: "power2.out" }, b);
        tl.fromTo(`#pb-lead${n}`, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.22, ease: "power2.inOut" }, b + 0.04);
        tl.fromTo(`#pb-k${n}`, { scaleX: 0.2, opacity: 0, clipPath: "inset(0 100% 0 0)" }, { scaleX: 1, opacity: 1, clipPath: "inset(0 0% 0 0)", duration: 0.36, ease: "power3.out" }, b + 0.16);
        if (i > 0) tl.set(`#pb-k${n}`, { clipPath: "inset(0 0% 0 0)" }, b + 0.53);
      });
      // labels fold back before the question (8.56 -> 8.74)
      tl.to(".pb-card", { opacity: 0, scaleX: 0.3, duration: 0.16, ease: "power2.in", stagger: 0.03 }, 2.12);
      tl.to(".pb-lead", { strokeDashoffset: 1, duration: 0.16, ease: "power2.in" }, 2.16);
      tl.to("#pb-m1 circle, #pb-m2 circle, #pb-m3 circle", { scale: 0, duration: 0.16, ease: "power2.in", transformOrigin: "50% 50%", transformBox: "fill-box" }, 2.2);
      // the question on 8.777 (local 2.345): waterfall entry, thread curls into the "?"
      const ws = DB.words(document.getElementById("pb-q").firstChild ? (() => { const q = document.getElementById("pb-q"); const span = document.createElement("span"); span.id = "pb-qt"; span.textContent = q.firstChild.textContent; q.replaceChild(span, q.firstChild); return span; })() : null);
      tl.fromTo(ws, { yPercent: 105, filter: "blur(6px)" }, { yPercent: 0, filter: "blur(0px)", duration: 0.4, ease: "power4.out", stagger: 0.03 }, 2.345);
      tl.fromTo("#pb-thread", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 2.36);
      tl.fromTo("#pb-dot", { scale: 0, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1, duration: 0.2, ease: "back.out(2)" }, 2.94);
      // whip out on the drop: everything flies up with blur, still moving at the cut (9.474)
      tl.to(ws, { y: -150, filter: "blur(10px)", opacity: 0, duration: 0.14, ease: "power3.in" }, 2.902);
      tl.to("#pb-thread, #pb-dot", { y: -150, opacity: 0, duration: 0.14, ease: "power3.in" }, 2.902);
      window.__timelines["probs"] = tl;
    })();
  </script>
</template>
