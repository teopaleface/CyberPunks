<template>
  <style>
    #root { position: absolute; inset: 0; }
    #hd-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  </style>
  <!-- The night-shift clock as a bezel around the planet (style frames 01, 02, 04):
       22:00 -> 06:00 track on a 12 h dial, a cyan progress arc that grows with time,
       the moon marker and the live time next to it. Tracked to the planet every frame. -->
  <div id="root" data-composition-id="hud" data-width="1920" data-height="1080">
    <svg id="hd-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow><g id="hd-g"></g></svg>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const B = DB.bezel(document.getElementById("hd-g"));
      const ease3 = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
      DB.drive(tl, 0, 20.457, (t) => {
        const p = DB.planet(t);
        const c = DB.clockTick(t);
        // 0 -> 0.975: the bezel draws itself clockwise from 22 (0.8 s power3.out), ticks pop in sequence
        B.update(p.x, p.y, p.r * 1.074, c.h, 0, { draw: ease3((t - 0.1) / 0.8), roll: c.roll, prevLabel: c.prev });
      });
      // the bezel pushes out with the planet at the drop and returns with it (index.html seams 3/4/5)
      window.__timelines["hud"] = tl;
    })();
  </script>
</template>
