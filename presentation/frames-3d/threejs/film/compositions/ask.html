<template>
  <style>
    #root { position: absolute; inset: 0; }
    #ak-shade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--db-navy) 0%, var(--db-navy) 36%, rgba(0, 15, 30, 0) 56%); }
    #ak-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .ak-h { position: absolute; left: 120px; font-size: 170px; }
    #ak-card { position: absolute; left: 0; top: 0; width: 600px; padding: 38px 42px; }
    #ak-tag { font-size: 30px; color: var(--db-cyan); display: flex; align-items: center; gap: 14px; }
    #ak-tag i { width: 16px; height: 16px; border-radius: 50%; background: var(--db-cyan); display: inline-block; }
    #ak-title { font-size: 50px; margin: 16px 0 30px; }
    #ak-btns { display: flex; gap: 18px; }
    .ak-b { font-size: 32px; }
    #ak-cursor { position: absolute; left: 0; top: 0; width: 100px; height: 127px; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3)); }
  </style>
  <!-- Style frame 05: close on the unsure house; solid navy left third; solid card, cyan Approve. -->
  <div id="root" data-composition-id="ask" data-width="1920" data-height="1080">
    <div id="ak-shade"></div>
    <svg id="ak-svg" viewBox="0 0 1920 1080" data-layout-allow-overflow><g id="ak-lines"></g><g id="ak-pings"></g><circle id="ak-house" r="18" fill="none" stroke-width="3" /><g id="ak-fx"></g></svg>
    <div class="ak-h display" id="ak-l1" style="top:300px">Not sure?</div>
    <div class="ak-h display" id="ak-l2" style="top:453px">It asks</div>
    <div class="ak-h display" id="ak-l3" style="top:606px">you.</div>
    <div id="ak-card" class="db-card">
      <div id="ak-tag" class="body"><i></i>Not sure</div>
      <div id="ak-title" class="head">Send a crew to<br />check this meter?</div>
      <div id="ak-btns"><div class="ak-b head db-btn-cyan" id="ak-yes">Approve</div><div class="ak-b head db-btn-ghost" id="ak-no">Skip</div></div>
    </div>
    <div id="ak-cursor"></div>
  </div>
  <script>
    (function () {
      const S0 = 16.556, D = 3.901;
      const tl = gsap.timeline({ paused: true });
      const cyan = DB.css("--db-cyan"), ink = DB.css("--db-ink");
      const L = DB.leader(document.getElementById("ak-lines"), cyan); L.el.id = "ak-ld";
      const P = DB.ping(document.getElementById("ak-pings"), cyan, true); P.g.id = "ak-pg"; P.g.setAttribute("opacity", 0);
      const F = DB.el("circle", { r: 14, fill: "none", stroke: cyan, "stroke-width": 3, opacity: 0, id: "ak-hit" }, document.getElementById("ak-pings"));
      const house = document.getElementById("ak-house"); house.setAttribute("stroke", cyan);
      const card = document.getElementById("ak-card"), yes = document.getElementById("ak-yes"), svgEl = document.getElementById("ak-svg");
      document.getElementById("ak-cursor").innerHTML = DB.CURSOR_SVG;
      const CW = 100, CH = 127;
      const rings = DB.clickRings(document.getElementById("ak-fx"), ink); rings.g.id = "ak-rings";
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const io2 = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const in4 = (x) => x * x * x * x;
      const COLLAPSE = [18.95, 19.25];
      DB.drive(tl, S0, D, (t) => {
        const h = DB.at("unsure_house", t);
        const cx = h.x - 50, cy = h.y - 560;
        // the card collapses into the cyan pin along a path to the house (power4.in)
        const k = in4(seg(t, COLLAPSE[0], COLLAPSE[1]));
        const tx = h.x - 300, ty = h.y - 160; // card centre offset at the end
        gsap.set(card, { x: cx + (tx - cx) * k * 0 + (h.x - (cx + 300)) * k, y: cy + (h.y - (cy + 159)) * k });
        L.update([[h.x, h.y], [h.x, cy + 318]]);
        P.update(h.x, h.y);
        house.setAttribute("cx", h.x.toFixed(1)); house.setAttribute("cy", h.y.toFixed(1));
        F.setAttribute("cx", h.x.toFixed(1)); F.setAttribute("cy", h.y.toFixed(1));
        // cursor: enters from off-screen right, arcs to Approve (0.6 s power2.inOut), holds 0.4 s, clicks 18.901
        // Approve centre from its real on-screen box (normalised to the 1920x1080 stage)
        const R = svgEl.getBoundingClientRect(), Y = yes.getBoundingClientRect(), K = 1920 / (R.width || 1920);
        const cr = card.getBoundingClientRect();
        const ox = (Y.left + Y.width / 2 - cr.left) * K, oy = (Y.top + Y.height / 2 - cr.top) * K;
        const bx = cx + (isFinite(ox) && ox > 0 ? ox : 137), by = cy + (isFinite(oy) && oy > 0 ? oy : 245);
        const kin = io2(seg(t, 17.9, 18.5));
        const kout = seg(t, 19.2, 19.75);
        const sx = 2060, sy = by + 260;
        const x = sx + (bx - sx) * kin + 900 * kout * kout;
        const y = sy + (by - sy) * kin - Math.sin(kin * Math.PI) * 120 + 140 * kout * kout;
        gsap.set("#ak-cursor", { x: x - DB.CURSOR_TIP[0] * CW, y: y - DB.CURSOR_TIP[1] * CH });
        rings.update(bx, by);
      });
      // headline: waterfall entry on 16.9 (binary opacity, power4.out)
      gsap.set(["#ak-l1", "#ak-l2", "#ak-l3", "#ak-card"], { opacity: 0 });
      [["#ak-l1", 16.9, 70, 0.2], ["#ak-l2", 16.95, 50, 0.17], ["#ak-l3", 16.992, 46, 0.15]].forEach(([s, t, y, d]) => {
        tl.set(s, { opacity: 1 }, t - S0);
        tl.fromTo(s, { y }, { y: 0, duration: d, ease: "power4.out", immediateRender: false }, t - S0);
      });
      // 17.345: the card arrives from below (binary opacity, power4.out 0.18 s); leader draws; ping on the house
      tl.set("#ak-card", { opacity: 1 }, 17.345 - S0);
      tl.fromTo("#ak-card > *", { y: 60 }, { y: 0, duration: 0.18, ease: "power4.out", immediateRender: false }, 17.345 - S0);
      tl.fromTo("#ak-ld", { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.25, ease: "power3.out" }, 17.345 - S0);
      tl.set("#ak-pg", { opacity: 1 }, 17.345 - S0);
      tl.set("#ak-house", { opacity: 0 }, 17.345 - S0);
      // click 18.901: squash -> spring; Approve presses; click rings
      const C = 18.901 - S0;
      tl.to("#ak-cursor", { scale: 0.86, duration: 0.06, ease: "power2.in", transformOrigin: "8% 6%" }, C - 0.03);
      tl.to("#ak-cursor", { scale: 1, duration: 0.24, ease: "back.out(1.6)", transformOrigin: "8% 6%" }, C + 0.03);
      tl.to("#ak-yes", { scale: 0.94, duration: 0.06, ease: "power2.in" }, C);
      tl.to("#ak-yes", { scale: 1, duration: 0.2, ease: "back.out(1.6)" }, C + 0.06);
      tl.set("#ak-rings", { opacity: 1 }, C);
      tl.fromTo("#ak-rings", { scale: 0.5, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, C);
      // collapse (shared-element morph): the card becomes a cyan dot on its way to the house
      tl.to("#ak-card > *", { opacity: 0, duration: 0.1, ease: "none" }, COLLAPSE[0] - S0);
      tl.to("#ak-card", { scale: 0.06, borderRadius: 300, backgroundColor: cyan, duration: 0.3, ease: "power4.in" }, COLLAPSE[0] - S0);
      tl.to("#ak-ld", { strokeDashoffset: 1.1, duration: 0.3, ease: "power4.in" }, COLLAPSE[0] - S0);
      tl.set("#ak-card", { opacity: 0 }, COLLAPSE[1] - S0);
      // the pin hits the house: one ping
      tl.set("#ak-hit", { opacity: 1 }, COLLAPSE[1] - S0);
      tl.fromTo("#ak-hit", { attr: { r: 14 } }, { attr: { r: 80 }, opacity: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, COLLAPSE[1] - S0);
      window.__timelines["ask"] = tl;
    })();
  </script>
</template>
