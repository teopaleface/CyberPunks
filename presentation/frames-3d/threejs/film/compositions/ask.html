<template>

  <script>
    (function () {
      const S0 = 16.556, D = 3.901;
      const tl = gsap.timeline({ paused: true });
      const clamp = (x) => Math.max(0, Math.min(1, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const p3o = (x) => 1 - Math.pow(1 - x, 3), p3i = (x) => x * x * x, p2i = (x) => x * x;
      const CARD = { dx: 150, dy: -330 }; // card top-left relative to the house anchor
      const H = 262; // approx card height
      DB.drive(tl, S0, D, (t) => {
        const a = DB.at("unsure_house", t);
        const k = p3i(seg(t, 18.95, 19.32)); // collapse into the pin
        const cx = a.x + CARD.dx, cy = a.y + CARD.dy;
        gsap.set("#ak-wrap", { x: cx + (a.x - cx) * k, y: cy + H * k + (a.y - cy - H) * k * 1.0 });
        const lx0 = cx + 26, ly0 = cy + H - 8;
        document.getElementById("ak-line").setAttribute("d", `M${a.x.toFixed(1)} ${a.y.toFixed(1)} L${(lx0 + (a.x - lx0) * k).toFixed(1)} ${(ly0 + (a.y - ly0) * k).toFixed(1)}`);
        const an = document.getElementById("ak-anchor");
        an.setAttribute("cx", a.x.toFixed(1)); an.setAttribute("cy", a.y.toFixed(1));
        // cursor: enters from below on 18.111, glides to Approve, clicks on 18.901, leaves right
        const btn = [cx + 34 + 70, cy + 30 + 16 + 18 + 104 + 28 + 29];
        const start = [btn[0] + 120, 1220];
        const kin = p3o(seg(t, 18.111, 18.78));
        const kout = p2i(seg(t, 19.15, 19.75));
        const x = start[0] + (btn[0] - start[0]) * kin + 900 * kout;
        const y = start[1] + (btn[1] - start[1]) * kin + 260 * kout;
        gsap.set("#ak-cursor", { x: x - 16.8, y: y - 11.1 });
      });
      // card pops on 17.345 (local 0.789), anchor dot and connector first
      tl.fromTo("#ak-anchor", { scale: 0, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1, duration: 0.3, ease: "back.out(2)" }, 0.6);
      tl.fromTo("#ak-line", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.24, ease: "power2.inOut" }, 0.66);
      tl.fromTo("#ak-card", { opacity: 0, scale: 0.9, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.789);
      tl.fromTo("#ak-tag, #ak-title, #ak-btns", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.36, ease: "power3.out", stagger: 0.06 }, 0.86);
      // click on Approve: 18.901 (local 2.345)
      tl.to("#ak-cur-in", { scale: 0.84, duration: 0.1, ease: "power2.in", transformOrigin: "12.5% 8.3%" }, 2.345);
      tl.to("#ak-cur-in", { scale: 1, duration: 0.22, ease: "power2.out", transformOrigin: "12.5% 8.3%" }, 2.445);
      tl.to("#ak-yes", { scale: 0.94, backgroundColor: "#3cc0f0", duration: 0.1, ease: "power2.in" }, 2.345);
      tl.to("#ak-yes", { scale: 1, backgroundColor: "#00a3e0", duration: 0.2, ease: "power2.out" }, 2.445);
      // the card collapses into the cyan pin that drops on the house (3D pin lands 19.45)
      tl.to("#ak-card", { scale: 0.03, borderRadius: 400, duration: 0.37, ease: "power3.in" }, 2.394);
      tl.to("#ak-card > *", { opacity: 0, duration: 0.14, ease: "power2.in" }, 2.394);
      tl.to("#ak-card", { opacity: 0, duration: 0.06 }, 2.76);
      tl.to("#ak-anchor", { scale: 2.4, opacity: 0, duration: 0.4, ease: "power2.out" }, 2.8);
      window.__timelines["ask"] = tl;
    })();
  </script>
