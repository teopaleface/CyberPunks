<template>
  <style>
    #root { position: absolute; inset: 0; }
    #ui-word { position: absolute; left: 250px; top: 70px; font-size: 190px; }
    #ui-tag { position: absolute; left: 1250px; top: 112px; font-size: 44px; line-height: 1.15; }
    #ui-win { position: absolute; left: 250px; top: 300px; width: 1420px; height: 740px; }
    #ui-tilt { position: absolute; inset: 0; transform: perspective(2600px) rotateX(9deg); transform-origin: 50% 0; }
    #ui-head { position: relative; height: 86px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid rgba(245, 247, 250, 0.08); }
    #ui-brand { font-size: 34px; }
    #ui-brand .body { font-size: 28px; margin-left: 26px; letter-spacing: 0; }
    #ui-btn { font-size: 28px; }
    #ui-body { position: absolute; left: 34px; top: 114px; right: 34px; bottom: 26px; display: flex; gap: 30px; }
    #ui-mapbox { width: 900px; height: 600px; border-radius: 22px; overflow: hidden; flex: none; }
    #ui-map { display: block; width: 900px; height: 600px; }
    #ui-crews { flex: 1; }
    #ui-ready { font-size: 28px; margin: 6px 0 20px; }
    .ui-name { font-size: 38px; }
    .ui-stops { font-size: 28px; margin-top: 6px; }
    #ui-cursor { position: absolute; left: 0; top: 0; width: 100px; height: 127px; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3)); }
    #ui-fx { position: absolute; left: 0; top: 0; width: 1420px; height: 740px; overflow: visible; z-index: 19; }
  </style>
  <!-- Style frame 03: the product. The window arrives composed inside the zoom-through
       (seam 3, stamped in index.html); the cursor rests on "Plan tomorrow" and clicks on 9.543. -->
  <div id="root" data-composition-id="ui" data-width="1920" data-height="1080">
    <div id="ui-word" class="display">Daybreak</div>
    <div id="ui-tag" class="body"><span id="ui-tag1" style="display:block">Tomorrow’s crews,</span><span id="ui-tag2" style="display:block">planned in one click.</span></div>
    <div id="ui-win">
      <div id="ui-tilt" class="db-win">
        <div id="ui-head">
          <div id="ui-brand" class="head">Daybreak<span class="body muted">Tomorrow’s plan · Banat</span></div>
          <div id="ui-btn" class="head db-btn-orange">Plan tomorrow</div>
        </div>
        <div id="ui-body">
          <div id="ui-mapbox"><svg id="ui-map" viewBox="0 0 900 600"></svg></div>
          <div id="ui-crews">
            <div id="ui-ready" class="body muted">3 crews ready</div>
            <div class="db-crew" id="ui-c1"><svg width="64" height="48" viewBox="0 0 64 48"><path class="ui-glyph" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg><div><div class="head ui-name">Crew 1</div><div class="body muted ui-stops">4 stops</div></div></div>
            <div class="db-crew" id="ui-c2"><svg width="64" height="48" viewBox="0 0 64 48"><path class="ui-glyph" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg><div><div class="head ui-name">Crew 2</div><div class="body muted ui-stops">3 stops</div></div></div>
            <div class="db-crew" id="ui-c3"><svg width="64" height="48" viewBox="0 0 64 48"><path class="ui-glyph" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></svg><div><div class="head ui-name">Crew 3</div><div class="body muted ui-stops">3 stops</div></div></div>
          </div>
        </div>
      </div>
      <svg id="ui-fx" viewBox="0 0 1420 740" data-layout-allow-overflow></svg>
      <div id="ui-cursor"></div>
    </div>
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const COL = { orange: DB.css("--db-orange"), cyan: DB.css("--db-cyan"), blue: DB.css("--db-blue") };
      const C = { road: DB.css("--db-map-road"), house: DB.css("--db-map-house"), depot: DB.css("--db-map-depot"), bg: DB.css("--db-map-bg"), ink: DB.css("--db-ink") };
      const svg = document.getElementById("ui-map");
      const el = DB.el, M = DB.map, toMap = DBL.toMap, s = DBL.scale;
      const pts = (a) => a.map((p) => toMap(p).map((v) => v.toFixed(1)).join(",")).join(" ");
      el("rect", { width: 900, height: 600, rx: 22, fill: C.bg }, svg);
      for (const r of M.roads) el("polyline", { points: pts(r.pts), fill: "none", stroke: C.road, "stroke-width": Math.max(14, r.w * M.pxPerUnit * s * 0.9).toFixed(1), "stroke-linecap": "round", "stroke-linejoin": "round" }, svg);
      for (const h of M.houseRects) {
        const [cx, cy] = toMap(h.c), w = h.d * s, d = h.w * s;
        const g = el("g", { transform: `translate(${cx.toFixed(1)} ${cy.toFixed(1)}) rotate(${h.rot.toFixed(1)})` }, svg);
        el("rect", { x: (-w / 2).toFixed(1), y: (-d / 2).toFixed(1), width: w.toFixed(1), height: d.toFixed(1), rx: (Math.min(w, d) * 0.24).toFixed(1), fill: C.house }, g);
      }
      el("polygon", { points: pts(M.depot), fill: C.depot, stroke: C.ink, "stroke-width": 3, "stroke-linejoin": "round" }, svg);
      // the three routes (drawn on the click) and their white-ringed stops
      const routeEls = DBL.stops.map((st) => el("polyline", { points: st.path.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" "), fill: "none", stroke: COL[st.key], "stroke-width": 12, "stroke-linecap": "round", "stroke-linejoin": "round", pathLength: 1, "stroke-dasharray": "1 1.2", "stroke-dashoffset": 1.1 }, svg));
      const objStops = [], otherStops = [];
      const landed = Object.values(DBL.LAND);
      DBL.stops.forEach((st) => st.pts.forEach((p, i) => {
        const c = el("circle", { cx: p[0].toFixed(1), cy: p[1].toFixed(1), r: 15, fill: COL[st.key], stroke: C.ink, "stroke-width": 5, opacity: 0 }, svg);
        (landed.some((L) => L.key === st.key && L.index === i) ? objStops : otherStops).push(c);
      }));
      // route glyphs on the crew cards (the real route shapes)
      DBL.stops.forEach((st, i) => {
        const xs = st.path.map((p) => p[0]), ys = st.path.map((p) => p[1]);
        const x0 = Math.min(...xs), y0 = Math.min(...ys), k = Math.min(54 / (Math.max(...xs) - x0 || 1), 38 / (Math.max(...ys) - y0 || 1));
        const g = document.querySelectorAll(".ui-glyph")[["orange", "cyan", "blue"].indexOf(st.key)];
        g.setAttribute("stroke", COL[st.key]);
        g.setAttribute("d", "M" + st.path.map((p) => ((p[0] - x0) * k + 5).toFixed(1) + " " + ((p[1] - y0) * k + 5).toFixed(1)).join(" L"));
      });

      // ---- the cursor rests on "Plan tomorrow" (window coords through the 9° tilt) ----
      document.getElementById("ui-cursor").innerHTML = DB.CURSOR_SVG;
      const btn = document.getElementById("ui-btn");
      const bx = btn.offsetLeft + btn.offsetWidth / 2, by = btn.offsetTop + btn.offsetHeight / 2;
      const [sx, sy] = DBL.winPoint(bx, by);
      const tip = [sx - DBL.WIN.left, sy - DBL.WIN.top];
      const CW = 100, CH = 127;
      const curAt = (x, y) => ({ x: x - DB.CURSOR_TIP[0] * CW, y: y - DB.CURSOR_TIP[1] * CH });
      gsap.set("#ui-cursor", curAt(tip[0], tip[1]));
      const fx = document.getElementById("ui-fx");
      const rings = DB.clickRings(fx, C.ink); rings.update(tip[0], tip[1]); rings.g.id = "ui-rings";
      // click on 9.543 (local 0.069): squash -> spring; button the same frame; click rings expand
      const CL = 0.069;
      tl.to("#ui-cursor", { scale: 0.86, duration: 0.06, ease: "power2.in", transformOrigin: "8% 6%" }, CL - 0.03);
      tl.to("#ui-cursor", { scale: 1, duration: 0.24, ease: "back.out(1.6)", transformOrigin: "8% 6%" }, CL + 0.03);
      tl.to("#ui-btn", { scale: 0.94, duration: 0.06, ease: "power2.in" }, CL);
      tl.to("#ui-btn", { scale: 1, duration: 0.26, ease: "back.out(1.6)" }, CL + 0.06);
      tl.set("#ui-rings", { opacity: 1 }, CL);
      tl.fromTo("#ui-rings", { scale: 0.5, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1.5, opacity: 0, duration: 0.5, ease: "expo.out", immediateRender: false }, CL);
      // same frame: the three routes draw along the map
      tl.fromTo(routeEls, { strokeDashoffset: 1.1 }, { strokeDashoffset: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, CL);
      // the three problem objects land on their stops at 9.75 (objects layer) and become these pins
      tl.set(objStops, { opacity: 1 }, 0.276);
      tl.fromTo(objStops, { scale: 1.6, transformOrigin: "50% 50%", transformBox: "fill-box" }, { scale: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, 0.276);
      // the other stops drop in with a small bounce on 10.309 (local 0.835)
      tl.set(otherStops, { opacity: 1 }, 0.835 - 0.12);
      tl.fromTo(otherStops, { y: -34 }, { y: 0, duration: 0.3, ease: "back.out(1.5)", stagger: 0.02, immediateRender: false }, 0.835 - 0.12);
      // wordmark + tagline: waterfall entry after the seam settles
      gsap.set(["#ui-word", "#ui-tag1", "#ui-tag2", "#ui-ready", "#ui-c1", "#ui-c2", "#ui-c3"], { opacity: 0 });
      const arrive = (sel, t, y, d) => { tl.set(sel, { opacity: 1 }, t); tl.fromTo(sel, { y }, { y: 0, duration: d, ease: "power4.out", immediateRender: false }, t); };
      arrive("#ui-word", 0.36, 70, 0.2);
      arrive("#ui-tag1", 0.43, 40, 0.15);
      arrive("#ui-tag2", 0.47, 40, 0.15);
      // crew cards fill in as their routes complete
      arrive("#ui-ready", 0.44, 30, 0.14);
      arrive("#ui-c1", 0.5, 40, 0.16);
      arrive("#ui-c2", 0.55, 40, 0.15);
      arrive("#ui-c3", 0.59, 40, 0.14);
      // the cursor drifts aside, then leaves the frame (its job is done) before the pull
      tl.to("#ui-cursor", { x: "+=120", y: "+=150", duration: 0.6, ease: "power2.out" }, 0.4);
      tl.to("#ui-cursor", { y: "+=900", duration: 0.45, ease: "power2.in" }, 1.0);
      window.__timelines["ui"] = tl;
    })();
  </script>
</template>
