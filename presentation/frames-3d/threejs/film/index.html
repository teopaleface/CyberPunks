<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Daybreak - Planet Daybreak (30 s)</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <!-- 3D layer data: per-frame anchor tracks + list of available 3D frames.
         Swap the 3D layer (Three.js previs or Blender frames) by replacing
         assets/frames3d/ + assets/frames3d/manifest.js + assets/tracks.js. -->
    <script src="assets/tracks.js"></script>
    <script src="assets/frames3d/manifest.js"></script>
    <script src="assets/db2d.js"></script>
    <style>
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Archivo"; src: url("assets/fonts/Archivo-wdth62_125-wght100_900-latin-ext.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      :root { --navy: #000f1e; --orange: #fa4616; --cyan: #00a3e0; --blue: #163fe8; --ink: #f5f7fa; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); font-family: "Archivo", sans-serif; }
      #db-bg { position: absolute; inset: 0; background: var(--navy); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="db-bg" class="clip" data-start="0" data-duration="30" data-track-index="0"></div>

      <!-- 3D layer (full-frame image sequence, swappable) -->
      <div id="layer3d" data-composition-id="layer3d" data-composition-src="compositions/layer3d.html"
        data-start="0" data-duration="30" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 1"></div>

      <!-- 2D layer, one scene per story beat, cut on the POWER beats -->
      <div id="storm" data-composition-id="storm" data-composition-src="compositions/storm.html"
        data-start="0" data-duration="6.432" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="probs" data-composition-id="probs" data-composition-src="compositions/probs.html"
        data-start="6.432" data-duration="3.042" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="ui" data-composition-id="ui" data-composition-src="compositions/ui.html"
        data-start="9.474" data-duration="1.625" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="routes" data-composition-id="routes" data-composition-src="compositions/routes.html"
        data-start="11.099" data-duration="5.457" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="ask" data-composition-id="ask" data-composition-src="compositions/ask.html"
        data-start="16.556" data-duration="3.901" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="dawn" data-composition-id="dawn" data-composition-src="compositions/dawn.html"
        data-start="20.457" data-duration="5.433" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="25.89" data-duration="4.11" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 3"></div>

      <!-- night-shift clock (22:00 -> 06:00) -->
      <div id="hud" data-composition-id="hud" data-composition-src="compositions/hud.html"
        data-start="0" data-duration="25.89" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080" style="z-index: 4"></div>

      <!-- music: local copy only, git-ignored (commercial track) -->
      <audio id="music" class="clip" data-start="0" data-duration="30" data-track-index="5" data-volume="1" src="assets/audio/local/power_30s.wav"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
