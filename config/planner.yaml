# Pragurile stratului de decizie (agentul). Proprietar: firul Teo-planificator.
# Fiecare decizie din plan scrie pragurile folosite (câmpul `threshold`) și regula (`rule_id`).
# Ipotezele de cost stau în config/economics.yaml; aici sunt doar regulile.
version: 1

global:
  min_net_value_lei: 0              # o echipă merge doar dacă valoarea așteptată depășește costul (vizită + deplasare): pragul de rentabilitate
  human_review_min_ev_lei: 150      # sub atât, un caz nesigur nu merită timpul unui om (≈ 15 min de dispecer și o vizită posibilă); intră la urmărire
  human_review_max_per_day: 25      # IPOTEZĂ: un dispecer analizează ~25 de cazuri pe zi (~10 min fiecare); în coadă intră întâi întăririle pentru furtună, apoi siguranța, apoi valoarea
  max_interval_width: 0.5           # interval de încredere mai larg de 0,5 = modelul nu e sigur, chiar dacă nu s-a abținut
  max_missing_ratio: 0.4            # peste 40% date lipsă la intrare, scorul nu e de încredere
  safety_priority_multiplier: 3.0   # riscul pentru oameni triplează prioritatea și intră primul în traseu
  safety_mandatory: true            # un caz cu risc pentru oameni intră în traseu oricare ar fi valoarea (siguranța înainte de bani); costul regulii e în evaluare
  safety_min_score: 0.7             # sub acest scor, semnalul de siguranță e prea slab: regulile obișnuite, fără regim de siguranță
  safety_unconfirmed_min_score: 0.95  # contor semnalat fără bilanț pentru post: regim de siguranță doar de la acest scor, cu încredere mare
                                    # (cu bilanț, decide bilanțul: manipularea fără energie lipsă la post nu dovedește o legătură ilegală)
  safety_max_mandatory_per_day: 12  # IPOTEZĂ: cota zilei pentru siguranță, ~jumătate din capacitatea echipelor de contorizare; restul cazurilor au prioritate triplă
  degraded_invalid_share: 0.2       # peste 20% linii respinse, sursa e "degraded"

meters:                             # A
  remote_min_score: 0.3             # sub 0,3, nici citirea la distanță nu merită: contorul intră la urmărire
  medium_confidence_margin: 0.25    # la încredere medie, vizita trebuie să aducă în plus 25% din costul ei (marjă de siguranță)
  visit_min_score: 0.5              # prag etic: echipa merge la ușa unui client doar dacă problema e mai probabilă decât lipsa ei; sub prag, citire la distanță
  smart_meter_default: true         # dacă lucrarea nu spune altfel (extra.smart_meter), contorul e inteligent și se poate citi de la distanță

storm:                              # B
  arrive_before_start_min: 60       # echipa ajunge cu cel puțin o oră înainte de începutul furtunii (extra.storm_onset; altfel time_window.start)
  max_crews_per_zone: 1             # o zonă primește cel mult o echipă trimisă din timp (o lucrare B = o zonă = o echipă care rămâne acolo)
  max_crews_per_region: 3           # câte echipe se mută din timp într-o regiune (restul rămân pentru lucrările curente și avariile obișnuite)
  preposition_min_score: 0.15       # sub această probabilitate nu se mută echipe din timp, oricât de mare e zona (se folosește pragul modelului B, extra.decision_threshold, dacă e mai mare)
  safety_gust_note: true            # la B, safety_flag = rafale ≥ 75 km/h: avertisment pentru echipă (nu lucrează la înălțime), nu prioritate obligatorie
  alert_min_score: 0.4              # de la acest scor, dispeceratul primește alerta, chiar dacă nu trimitem echipa
  critical_alert_min_score: 0.75    # de la acest scor, alerta e critică

voltage:                            # C
  min_score: 0.5                    # sub 0,5, postul intră la urmărire
  outage_voltage_level: lv          # schimbarea prizei afectează clienți JT: preaviz outages.planned_notice_working_days_lv
  notify_window: ["11:00", "15:00"] # fereastra de soare pentru mesajul către prosumatori, dacă lucrarea nu are time_window
  notify_send_time: "18:00"         # mesajele pentru mâine pleacă azi la 18:00 (doar demo)

bilant:                             # bilanț pe post (lucrări A în A_bilant.jsonl)
  visit_min_score: 0.0              # la nivel de post nu batem la ușa unui client, deci fără pragul etic al contoarelor

remedy:                             # scara de soluții pentru tensiune (C)
  max_combination: 3                # câte trepte se combină cel mult (efectele se adună: P90 = P90 inițial + suma efectelor)
  crew_steps_need_notice: [adjust_tap, phase_rebalance]   # trepte cu întrerupere planificată: preaviz ANRE

posts:                              # harta posturilor din interfață, după lei pierduți pe lună (bilanț)
  yellow_lei_month: 200             # IPOTEZĂ: de aici postul e galben
  red_lei_month: 600                # exemplul din conceptul lui Teo ("aproximativ 600 lei pe lună"): de aici postul e roșu

estimate:                           # pasul Estimate în modul auto
  reuse_fresh_output: [A_bilant]    # modele lente (bilanțul rulează ~4 minute): ieșirea lor pentru aceeași zi se refolosește
  max_age_hours: 12                 # cât de veche poate fi ieșirea refolosită (doar la scenariile cu dată mobilă, ca `maine`; la o zi istorică, oricât)

alerts:
  max_per_kind: 3                   # peste atâtea alerte de același fel (de exemplu siguranță), se strâng într-una singură

routing:
  solver: ortools                   # ortools | greedy
  time_limit_s: 60                  # plasă de siguranță; în mod normal oprește limita de soluții de mai jos
  solution_limit: 200               # oprire după un număr fix de soluții: același plan la fiecare rulare, oricât de ocupat
                                    # e calculatorul (cu limita de 10 s, planul real ieșea puțin diferit de la o rulare la alta)
  briefing_min: 30                  # instructaj și încărcare la bază înainte de plecare
  break_min: 30                     # pauza din tură (scade din timpul disponibil)
  value_scale: 100                  # lei → bani, pentru costurile întregi din OR-Tools
