# Ipoteze economice. Proprietar: firul Teo-planificator. Verificate în faza 0 (7 nov. 2026); detalii și citate
# în docs/research/planificator.md. Fiecare WorkItem trimite aici prin impact.assumptions_ref.
# Etichete: SURSĂ = cifra apare în documentul citat; PROXY = cifră reală folosită ca aproximare;
# CALCUL = derivată din surse, cu formula; IPOTEZĂ = fără sursă, aleasă cu motiv (de variat la sensibilitate).
currency: RON
eur_ron: 5.3403                          # SURSĂ: curs BNR 2 nov. 2026 (cursbnr.nxm.ro preia cursul BNR)
energy:
  retail_price_lei_per_kwh: 1.56         # SURSĂ: PPC Energie, comunicat 18.03.2026 "PPC Ore Smart+": preț final cu taxe, casnic București, în afara intervalelor Smart (0,98 în intervale)
  loss_cost_lei_per_kwh: 0.70            # PROXY: preț PZU OPCOM, medie ponderată ian.-oct. 2026 ≈ 726 lei/MWh (calcul din rapoartele lunare OPCOM); 2025: 575,22 lei/MWh (raport anual OPCOM). Prețul CPT recunoscut de ANRE nu l-am găsit
meters:                                  # A
  inspection_visit_cost_lei: 250         # PROXY: tarif Rețele Electrice, Zona Muntenia 2026, poz. 18 "citire la cererea clientului" = 246,89 lei fără TVA (o deplasare a unei echipe la contor)
  remote_reading_cost_lei: 2             # IPOTEZĂ: telecitirea nu se taxează (tarif 2026, poz. 17), deci costul marginal e mic (comunicație PLC/GPRS)
  detection_horizon_days: 90             # IPOTEZĂ: intervalul maxim de citire la casnici e 3 luni (Legea 123/2012 art. 45 alin. 10, după presă); pierderea durează până la prima citire care o arată
  recalculation_cap_years: 3             # SURSĂ: Ord. ANRE 190/2020, art. 12 alin. (1): recalcularea consumului la contor defect nu poate depăși 3 ani
  service_time_min: 40                   # IPOTEZĂ: verificarea contorului la fața locului (citire index, sigilii, fotografii)
  fraud_finding_tariff_lei: 830.85       # SURSĂ: tarif Rețele Electrice Muntenia 2026, poz. 64 "constatare intervenție frauduloasă (<=10 kVA)", fără TVA (reper, nu intră în decizie)
storm:                                   # B
  preposition_cost_lei_per_crew_shift: 2700   # CALCUL (IPOTEZĂ): 3 oameni × 8 h × 58,1 lei/h (câștig mediu brut iulie 2026, 9.709 lei/lună) × 1,0225 (CAM) × 1,75 (spor ore suplimentare, Codul muncii art. 123) + ~200 lei vehicul; interval 1.500-4.100
  cost_per_customer_hour_lei: 12              # CALCUL (IPOTEZĂ): VoLL casnic România 4,52 €/kWh (CEPA pentru ACER, 2018, tabel G.1) × 0,23 kWh/h × 5,34 lei/€ ≈ 5,5 lei; cu 15% clienți non-casnici ≈ 15 lei; interval 5,5-15
  restoration_speedup_hours: 2.5              # IPOTEZĂ: n-am găsit un studiu verificabil; de variat 1-4 h
  compensation_lei_per_customer_lv: 30        # SURSĂ: Ord. ANRE 46/2021, Anexa 1: 30 lei JT (200 MT, 300 la 110 kV) la depășirea duratei maxime de restabilire; plată automată (art. 36)
  restoration_limit_hours:                    # SURSĂ: Ord. ANRE 46/2021, art. 15 alin. (1)
    urban: 6
    county_seat: 4
    rural: 12
    severe_weather_intravilan: 48
    severe_weather_extravilan: 72
voltage:                                 # C
  tap_change_visit_cost_lei: 450         # IPOTEZĂ: echipă de 3 oameni, ~2 h cu deplasarea (fără costul întreruperii, calculat separat)
  measurement_campaign_cost_lei: 300     # IPOTEZĂ: montarea unui analizor de calitate a energiei la post
  lost_pv_value_lei_per_kwh: 0.40        # IPOTEZĂ în interval cu surse: 0,348 (energie activă PPC Ore Smart+ la prânz) - 0,73 (PZU 2026); prosumatorii <=200 kW sunt compensați la prețul energiei active (Legea 160/2026, art. 73^1)
  overvoltage_limit_pu: 1.10             # SURSĂ: Ord. ANRE 228/2018, Tabelul 2P: maxima de tensiune 1,1 Un mediată la 10 minute (treapta instantanee 1,15 Un, 0,5 s); EN 50160 ±10%
  planned_outage_hours: 1.0              # IPOTEZĂ: întreruperea scurtă pentru schimbarea prizei (comutator fără sarcină)
  notification_cost_lei_per_customer: 0.05    # IPOTEZĂ: un SMS (în demo nu se trimite nimic)
outages:                                 # reguli ANRE pentru întreruperile planificate
  planned_notice_working_days_lv: 2      # SURSĂ: Ord. ANRE 46/2021, art. 12 alin. (2) lit. c): JT, minimum 2 zile lucrătoare, presă și site
  planned_notice_working_days_mv: 5      # SURSĂ: art. 12 alin. (2) lit. b): MT/IT, minimum 5 zile lucrătoare
  planned_notice_working_days_vulnerable: 15  # SURSĂ: art. 12 alin. (2) lit. a): clienți mari și vulnerabili, 15 zile lucrătoare, reanunț la 5
  planned_max_hours: 8                   # SURSĂ: art. 13 alin. (1): o întrerupere planificată durează cel mult 8 ore
  planned_max_per_year_urban: 4          # SURSĂ: art. 13 alin. (1)
  planned_max_per_year_rural: 8          # SURSĂ: art. 13 alin. (1)
crew:
  cost_lei_per_person_hour: 59.4         # CALCUL (IPOTEZĂ): 9.709 lei brut/lună (câștig mediu pe economie, iulie 2026, INS după presă) / 167 h × 1,0225 (CAM); media CAEN 35 e mai mare (~15.000 lei, agregatori)
travel:
  avg_speed_kmh_urban: 22                # IPOTEZĂ: trafic urban București în timpul zilei
  avg_speed_kmh_rural: 45                # IPOTEZĂ: drumuri județene și naționale
  urban_km: 10                           # IPOTEZĂ: primii 10 km ai unui drum se fac cu viteza urbană, restul cu cea extraurbană
  road_factor: 1.35                      # IPOTEZĂ: distanța pe drum ≈ distanța în linie dreaptă × factor (circuity factor)
  vehicle_cost_lei_per_km: 1.2           # IPOTEZĂ: combustibil (~8 l/100 km) plus întreținere și amortizare pentru o autoutilitară
