# Ipoteze economice. Proprietar: firul Teo-planificator. Verificate în faza 0 (7 nov. 2026); detalii și citate
# în docs/research/planificator.md. Fiecare WorkItem trimite aici prin impact.assumptions_ref.
# Etichete: SURSĂ = cifra apare în documentul citat; PROXY = cifră reală folosită ca aproximare;
# CALCUL = derivată din surse, cu formula; IPOTEZĂ = fără sursă, aleasă cu motiv (de variat la sensibilitate).
currency: RON
eur_ron: 5.3403                          # SURSĂ: curs BNR 2 nov. 2026 (cursbnr.nxm.ro preia cursul BNR)
energy:
  retail_price_lei_per_kwh: 1.56         # SURSĂ: PPC Energie, comunicat 18.03.2026 "PPC Ore Smart+": preț final cu taxe, casnic București, în afara intervalelor Smart (0,98 în intervale)
  loss_cost_lei_per_kwh: 0.70            # PROXY: preț PZU OPCOM, medie ponderată ian.-oct. 2026 ≈ 726 lei/MWh (calcul din rapoartele lunare OPCOM); 2025: 575,22 lei/MWh (raport anual OPCOM). Prețul CPT recunoscut de ANRE nu l-am găsit
meters:                                  # A
  inspection_visit_cost_lei: 250         # PROXY: tarif Rețele Electrice, Zona Muntenia 2026, poz. 18 "citire la cererea clientului" = 246,89 lei fără TVA (o deplasare a unei echipe la contor)
  remote_reading_cost_lei: 2             # IPOTEZĂ: telecitirea nu se taxează (tarif 2026, poz. 17), deci costul marginal e mic (comunicație PLC/GPRS)
  detection_horizon_days: 90             # IPOTEZĂ: intervalul maxim de citire la casnici e 3 luni (Legea 123/2012 art. 45 alin. 10, după presă); pierderea durează până la prima citire care o arată
  recalculation_cap_years: 3             # SURSĂ: Ord. ANRE 190/2020, art. 12 alin. (1): recalcularea consumului la contor defect nu poate depăși 3 ani
  service_time_min: 40                   # IPOTEZĂ: verificarea contorului la fața locului (citire index, sigilii, fotografii)
  smart_meter_share_2025: {muntenia_sud: 0.5881, dobrogea: 0.6685, banat: 0.5645}   # SURSĂ (secundară): gradul de integrare a contoarelor inteligente la 31.12.2025 (infobuz, după documentul de research). Lucrările A vin din curbe la 15 minute, deci din contoare inteligente
  fraud_finding_tariff_lei: 830.85       # SURSĂ: tarif Rețele Electrice Muntenia 2026, poz. 64 "constatare intervenție frauduloasă (<=10 kVA)", fără TVA (reper, nu intră în decizie)
storm:                                   # B
  preposition_cost_lei_per_crew_shift: 2700   # CALCUL (IPOTEZĂ): 3 oameni × 8 h × 58,1 lei/h (câștig mediu brut iulie 2026, 9.709 lei/lună) × 1,0225 (CAM) × 1,75 (spor ore suplimentare, Codul muncii art. 123) + ~200 lei vehicul; interval 1.500-4.100
  cost_per_customer_hour_lei: 12              # CALCUL (IPOTEZĂ): VoLL casnic România 4,52 €/kWh (CEPA pentru ACER, 2018, tabel G.1) × 0,23 kWh/h × 5,34 lei/€ ≈ 5,5 lei; cu 15% clienți non-casnici ≈ 15 lei; interval 5,5-15
  restoration_speedup_hours: 2.5              # IPOTEZĂ: n-am găsit un studiu verificabil; de variat 1-4 h
  customers_helped_per_crew_shift: 500        # CALCUL (IPOTEZĂ): furtuna din Timiș, 7-9 iulie 2025: ~40.000 de consumatori afectați și 80 de echipe RER și contractori pe teren (prefectul Timișului, pressalert.ro, citat de firul B) → ~500 de clienți pe echipă. O echipă trimisă din timp scurtează întreruperea pentru cel mult atâția clienți, oricât de mare e avaria
  compensation_lei_per_customer_lv: 30        # SURSĂ: Ord. ANRE 46/2021, Anexa 1: 30 lei JT la depășirea duratei maxime de restabilire; plată automată (art. 36)
  compensation_lei_per_customer_mv: 200       # SURSĂ: idem, medie tensiune
  compensation_lei_per_customer_hv: 300       # SURSĂ: idem, 110 kV
  compensation_cap_lei_per_month_lv: 50       # SURSĂ: art. 36 alin. (5): plafonul lunar al compensațiilor pentru un client JT
  compensations_paid_2024_lei: 23000000       # SURSĂ (context, presă): RER a plătit circa 23 mil. lei compensații în 2024 (https://www.forbes.ro/?p=458099, preluat de firul B)
  customers_total: 3180331                    # SURSĂ: Planul de dezvoltare RER 2026-2035, tabelele 2.1-2.3 (31.12.2024); pe județe în config/area.yaml
  share_of_national_compensations: 0.85       # SURSĂ (secundară): RER plătește circa 85% din compensațiile automate din țară (raportul ANRE pe 2024, după documentul de research din 7 nov.); doar procentul, sumele absolute diferă între surse
  restoration_limit_hours:                    # SURSĂ: Ord. ANRE 46/2021, art. 15 alin. (1)
    urban: 6
    county_seat: 4
    rural: 12
    severe_weather_intravilan: 48
    severe_weather_extravilan: 72
voltage:                                 # C
  tap_change_visit_cost_lei: 450         # IPOTEZĂ: echipă de 3 oameni, ~2 h cu deplasarea (fără costul întreruperii, calculat separat)
  measurement_campaign_cost_lei: 300     # IPOTEZĂ: montarea unui analizor de calitate a energiei la post
  lost_pv_value_lei_per_kwh: 0.40        # IPOTEZĂ în interval cu surse: 0,348 (energie activă PPC Ore Smart+ la prânz) - 0,73 (PZU 2026); prosumatorii <=200 kW sunt compensați la prețul energiei active (Legea 160/2026, art. 73^1)
  overvoltage_limit_pu: 1.10             # SURSĂ: Ord. ANRE 228/2018, Tabelul 2P: maxima de tensiune 1,1 Un mediată la 10 minute (treapta instantanee 1,15 Un, 0,5 s); EN 50160 ±10%
  planned_outage_hours: 1.0              # IPOTEZĂ: întreruperea scurtă pentru schimbarea prizei (comutator fără sarcină)
  notification_cost_lei_per_customer: 0.05    # IPOTEZĂ: un SMS (în demo nu se trimite nimic)
  complaint_compensation_lei: 70         # SURSĂ (firul C): Ord. ANRE 46/2021, anexa 4: compensația pentru o reclamație de calitate a tensiunii nerezolvată la termen, client casnic
  complaint_compensation_lei_legal: 130  # SURSĂ (firul C): idem, persoane juridice
  quality_limit_95pct_pu: 1.05           # SURSĂ (firul C): Ord. ANRE 46/2021, art. 25 alin. (2): limita pentru 95% din valorile medii la 10 minute
  ore_smart_midday: "11:00-14:59, 1 martie - 31 octombrie"   # SURSĂ: PPC Energie, comunicat 18.03.2026 (intervalele Smart de la prânz)
  # Scara de soluții (C și planificatorul citesc aceleași chei). Treptele: fazele, priza, mesajele, bateriile, limita de export, transformatorul.
  notify_participation_rates: [0.10, 0.20, 0.30]   # IPOTEZĂ (firul C): câți clienți Ore Smart țintiți mută consumul la orele cu risc (pesimist, central, optimist)
  phase_rebalance_cost_lei: 350          # IPOTEZĂ (firul C): o echipă de 2, o oră plus deplasarea
  phase_rebalance_outage_hours: 0.5      # IPOTEZĂ: casele mutate pe altă fază rămân fără curent cel mult o jumătate de oră (întrerupere planificată, cu preaviz)
  export_limit_cost_lei: 150             # IPOTEZĂ (firul C): setare de la distanță sau vizită scurtă la invertor
  transformer_upgrade_cost_lei: 120000   # IPOTEZĂ (firul C): post nou sau transformator mai mare; n-am găsit cifre românești
  battery_offer_cost_lei_per_customer: 2 # IPOTEZĂ: costul ofertei prin canalele PPC Energie (venitul îl calculează C)
battery:                                 # treapta 4: bateria calculată pe profilul fiecărui prosumator
  sizes_kwh: [5, 10, 15]                 # variantele din conceptul lui Teo
  price_lei_per_kwh_installed: 1500      # PROXY: costul standard maxim eligibil în Casa Verde Baterii 2026 (Ord. 1.904/2026, MO 775/14.09.2026), cu montaj și invertor hibrid (startupcafe.ro, 16.09.2026). Firul C propusese 2.500 (IPOTEZĂ)
  price_lei_per_kwh: 1250                # IPOTEZĂ între surse: 1.250 (o versiune a ghidului AFM, după presă) și 1.500 lei/kWh (ghidul final, cu montaj)
  installation_cost_lei: 2500            # IPOTEZĂ: la 10 kWh dă 15.000 lei, adică 1.500 lei/kWh, plafonul de mai sus
  afm_grant_share: 0.75                  # SURSĂ: idem, cel mult 75% din valoarea proiectului
  afm_grant_cap_lei: 15000               # SURSĂ: idem, cel mult 15.000 lei cu TVA
  afm_min_kwh: 10                        # SURSĂ: idem, capacitate minimă 10 kWh (o versiune anterioară a ghidului cerea 12 kWh)
  ppc_margin_share: 0.15                 # IPOTEZĂ (firul C): marja PPC Energie din vânzarea bateriei
  cycle_value_lei_per_kwh: 0.6           # IPOTEZĂ (firul C): valoarea energiei mutate de la prânz în seara cu deficit
outages:                                 # reguli ANRE pentru întreruperile planificate
  planned_notice_working_days_lv: 2      # SURSĂ: Ord. ANRE 46/2021, art. 12 alin. (2) lit. c): JT, minimum 2 zile lucrătoare, presă și site
  planned_notice_working_days_mv: 5      # SURSĂ: art. 12 alin. (2) lit. b): MT/IT, minimum 5 zile lucrătoare
  planned_notice_working_days_vulnerable: 15  # SURSĂ: art. 12 alin. (2) lit. a): clienți mari și vulnerabili, 15 zile lucrătoare, reanunț la 5
  planned_max_hours: 8                   # SURSĂ: art. 13 alin. (1): o întrerupere planificată durează cel mult 8 ore
  planned_max_per_year_urban: 4          # SURSĂ: art. 13 alin. (1)
  planned_max_per_year_rural: 8          # SURSĂ: art. 13 alin. (1)
crew:
  cost_lei_per_person_hour: 59.4         # CALCUL (IPOTEZĂ): 9.709 lei brut/lună (câștig mediu pe economie, iulie 2026, INS după presă) / 167 h × 1,0225 (CAM); media CAEN 35 e mai mare (~15.000 lei, agregatori)
travel:
  avg_speed_kmh_urban: 22                # IPOTEZĂ: trafic urban București în timpul zilei
  avg_speed_kmh_rural: 45                # IPOTEZĂ: drumuri județene și naționale
  urban_km: 10                           # IPOTEZĂ: primii 10 km ai unui drum se fac cu viteza urbană, restul cu cea extraurbană
  road_factor: 1.35                      # IPOTEZĂ: distanța pe drum ≈ distanța în linie dreaptă × factor (circuity factor)
  vehicle_cost_lei_per_km: 1.2           # IPOTEZĂ: combustibil (~8 l/100 km) plus întreținere și amortizare pentru o autoutilitară
bilant:                                  # bilanț pe post (firul Teo-bilant): lucrări cu sursa A în A_bilant.jsonl
  office_correction_cost_lei: 15         # CALCUL (IPOTEZĂ): 15 minute de lucru în birou × 59,4 lei/h (crew.cost_lei_per_person_hour)
  grid_inspection_cost_lei: 486          # PROXY: tarif Rețele Electrice Muntenia 2026, "constatare de comisia de expertiză a stării tehnice a echipamentului", 485,67 lei fără TVA
  grid_inspection_service_min: 90        # IPOTEZĂ: verificarea postului și a plecărilor de joasă tensiune, dacă lucrarea nu dă durata
losses:                                  # pierderile în rețea (CPT): pentru bilanț și pentru prețul energiei pierdute
  cpt_rate_muntenia_2023: 0.0866         # SURSĂ (secundară): Planul de dezvoltare RER 2024-2033, după documentul de research din 7 nov. (10,78% în 2018)
  cpt_recognized_rate_muntenia: 0.0897   # SURSĂ (secundară): idem, nivelul CPT recunoscut de ANRE; ce depășește nivelul recunoscut plătește distribuitorul
  cpt_share_lv: 0.6354                   # SURSĂ (secundară): idem, partea din CPT pierdută la joasă tensiune (unde lucrează bilanțul pe post)
